openapi: 3.0.3
info:
  title: Express API for Space2Study
  version: 1.0.0

security:
  - BearerAuth: []

servers:
- url: http://localhost:8080/api-docs
  description: Local server 

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Category:
      type: object
      required:
        - name
      properties:
        _id:
          type: string
          example: "64f1c9e2a1b2c3d4"
        name:
          type: string
          example: "Design"
        appearance:
          type: object
          required:
          - icon
          - color
          properties:
            color:
              type: string
              example: "mint"
            icon:
              type: string
              example: "DesignServicesIcon"
    Subject:
      type: object
      required:
        - name
        - categoryId
      properties:
        _id:
          type: string
          example: "64f1c9e2a1b2c3d7"
        name:
          type: string
          example: "Art"
        categoryId:
          type: string
          example: "64f1c9e2a1b2c3d4"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: '404'
        message:
          type: string
          example: The requested URL was not found
  parameters:
    Id:
      name: id
      in: path
      description: Resource ID
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Limit:
      name: limit
      in: query
      description: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    Offset:
      name: offset
      in: query
      description: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 10
  responses:
    NotFound:
      description: The resource is not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IllegalInput:
      description: The input is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /subjects:
    get:
      summary: Get subjects list
      tags: 
        - subjects
      responses:
        200:
          description: Returns a list of available subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
        401:
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - subjects
      summary: Create a new subject
      description: Create a new subject
      requestBody:
        description: Add a new subject to the database
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subject'
        required: true
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        401:
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /subjects/names:
    get:
      summary: Get subject names list
      tags: 
        - subjects
      responses:
        200:
          description: Returns a list of all subject names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
              example:
                - _id: "695c060997fb7cb113616ca1"
                  name: "Art"
                - _id: "695c06d84552b0992f868d7f"
                  name: "Painting"
        401:
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /filterBy:
    get:
      summary: Get subjects list filtered by category id
      tags: 
        - subjects
      parameters:
        - name: categoryId
          in: query
          description: Category id value that need to be considered for filter
          explode: true
          schema:
            type: string
      responses:
        200:
          description: Returns a list of available subjects filtered by category id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
              example:
                - _id: "695c08cd8f7fac29856c6b73"
                  name: "English"
                  categoryId: "695c1276a7bab9115fc79d65"
                - _id: "695c0e09aaf81975790a04e3"
                  name: "French"
                  categoryId: "695c1276a7bab9115fc79d65"
        401:
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories:
    get:
      summary: Get categories list
      tags: 
        - categories
      responses:
        200:
          description: Returns a list of available categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        401:
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - categories
      summary: Create a new category
      description: Create a new category
      requestBody:
        description: Add a new category to the database
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        401:
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories/{name}:
    get:
      tags:
        - categories
      summary: Get category by name.
      description: Get category detail based on name.
      parameters:
        - name: name
          in: path
          description: The name that needs to be fetched. Use Music for testing
          schema:
            type: string
      responses:
        200:
          description: Returns category
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/Category'
        401:
          description: Unauthorized
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"